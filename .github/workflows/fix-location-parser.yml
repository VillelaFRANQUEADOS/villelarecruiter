name: Fix location parser

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply location parser fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch parser
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/cv-parser.functions.ts')
          lines = p.read_text().splitlines()
          for i, line in enumerate(lines):
              if 'const re = new RegExp(`(?:^|[|•·;:])([^|•·;:]{0,180}?)' in line and 'stateName.replace' in line:
                  lines[i] = r'''    const re = new RegExp(`([^|•·;:]{0,180}?)\s*(?:,|/|-|—|–|\s)\s*${stateName.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}(?:\s*,?\s*Brasil)?\b`, "i");'''
                  break
          else:
              raise SystemExit('target regex not found')
          p.write_text("\n".join(lines) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/cv-parser.functions.ts
          git commit -m "Apply location parser fix"
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-location-parser.yml
          git commit -m "Remove temporary location parser workflow"
          git push
