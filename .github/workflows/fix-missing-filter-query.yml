name: Fix missing-data filter query

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix missing-data filter query') && !contains(github.event.head_commit.message, 'Remove temporary missing-filter fix workflow') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix query
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/ats-data.ts')
          s = p.read_text()
          bad = '''  qb = qb\n    if (filters.dadosFaltantes?.length) {\n      const missing = new Set(filters.dadosFaltantes);\n      const clauses: string[] = [];\n      if (missing.has("cidade")) clauses.push("cidade.is.null", "cidade.eq.");\n      if (missing.has("uf")) clauses.push("estado.is.null", "estado.eq.");\n      if (missing.has("telefone")) clauses.push("telefone.is.null", "telefone.eq.");\n      if (clauses.length) query = query.or(clauses.join(","));\n    }\n.range(from, to);'''
          good = '''  if (filters.dadosFaltantes?.length) {\n    const missing = new Set(filters.dadosFaltantes);\n    const clauses: string[] = [];\n    if (missing.has("cidade")) clauses.push("cidade.is.null", "cidade.eq.");\n    if (missing.has("uf")) clauses.push("estado.is.null", "estado.eq.");\n    if (missing.has("telefone")) clauses.push("telefone.is.null", "telefone.eq.");\n    if (clauses.length) qb = qb.or(clauses.join(","));\n  }\n  qb = qb.range(from, to);'''
          if bad not in s:
              raise SystemExit('Expected malformed missing-data query block was not found')
          p.write_text(s.replace(bad, good, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/ats-data.ts
          git diff --cached --check
          git commit -m "Fix missing-data filter query"
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-missing-filter-query.yml
          git commit -m "Remove temporary missing-filter fix workflow"
          git push
