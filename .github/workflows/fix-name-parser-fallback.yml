name: Fix deterministic name validation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply deterministic name validation') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch parser
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/cv-parser.functions.ts')
          s = p.read_text()
          old = 'nome: identity.nome || extractName(text),'
          new = 'nome: normalizeCandidateName(identity.nome || extractName(text)),'
          if old not in s:
              raise SystemExit('target deterministic name line not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/cv-parser.functions.ts
          git commit -m "Apply deterministic name validation"
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-name-parser-fallback.yml
          git commit -m "Remove temporary deterministic name workflow"
          git push
