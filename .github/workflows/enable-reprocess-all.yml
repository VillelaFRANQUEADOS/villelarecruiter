name: Enable CV reprocessing for all profiles

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Enable CV reprocessing for all profiles') && !contains(github.event.head_commit.message, 'Remove temporary reprocess workflow') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply permission changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Frontend: show single and bulk reprocess actions to every authenticated profile.
          p = Path('src/routes/_authenticated/candidatos.tsx')
          s = p.read_text()
          old = '''                {role === "admin" && (\n                  <Button\n                    size="sm"\n                    variant="outline"\n                    onClick={handleBulkReprocess'''
          new = '''                <Button\n                  size="sm"\n                  variant="outline"\n                  onClick={handleBulkReprocess'''
          if old not in s:
              raise SystemExit('bulk reprocess UI block not found')
          s = s.replace(old, new, 1)

          old = '''                  >\n                    <RefreshCw className={`size-3.5 ${bulkReprocessing ? "animate-spin" : ""}`} />\n                    {bulkReprocessing ? "Reprocessando..." : "Reprocessar"}\n                  </Button>\n                )}'''
          new = '''                >\n                  <RefreshCw className={`size-3.5 ${bulkReprocessing ? "animate-spin" : ""}`} />\n                  {bulkReprocessing ? "Reprocessando..." : "Reprocessar"}\n                </Button>'''
          if old not in s:
              raise SystemExit('bulk reprocess closing block not found')
          s = s.replace(old, new, 1)

          old = '''                            {role === "admin" && r.curriculo_url && (\n                              <DropdownMenuItem'''
          new = '''                            {r.curriculo_url && (\n                              <DropdownMenuItem'''
          if old not in s:
              raise SystemExit('single reprocess UI block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Backend: any authenticated user may reprocess a CV. Authentication is still required by middleware.
          p = Path('src/lib/cv-parser.functions.ts')
          s = p.read_text()
          old = '''    // Permissão: somente administradores podem reprocessar\n    const { data: roleRow } = await supabase\n      .from("user_roles")\n      .select("role")\n      .eq("user_id", userId)\n      .eq("role", "admin")\n      .maybeSingle();\n    if (!roleRow) throw new Error("Acesso negado: apenas administradores podem reprocessar currículos.");\n\n    const apiKey = process.env.GEMINI_API_KEY;'''
          new = '''    // Qualquer usuário autenticado pode reprocessar currículos.\n    // A autenticação continua sendo obrigatória pelo middleware requireSupabaseAuth.\n\n    const apiKey = process.env.GEMINI_API_KEY;'''
          if old not in s:
              raise SystemExit('backend admin-only block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/candidatos.tsx src/lib/cv-parser.functions.ts
          git commit -m "Enable CV reprocessing for all authenticated profiles"
          git push

      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/enable-reprocess-all.yml
          git commit -m "Remove temporary reprocess workflow"
          git push
